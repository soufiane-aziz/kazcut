<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kazcutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362B26" />
      <stop offset="100%" stop-color="#1F1714" />
    </linearGradient>
    <linearGradient id="caramelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA25E" />
      <stop offset="50%" stop-color="#C58842" />
      <stop offset="100%" stop-color="#A56E30" />
    </linearGradient>
    <linearGradient id="cutAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E9" />
      <stop offset="100%" stop-color="#E7DFCC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#kazcutBg)" stroke="#C58842" stroke-opacity="0.25" stroke-width="4" filter="url(#shadow)" />

  <!-- Vertical Stem of 'K' with precision cut at top-right -->
  <path d="M 148 136 L 208 136 C 212 136 216 140 216 144 L 216 368 C 216 372 212 376 208 376 L 148 376 C 144 376 140 372 140 368 L 140 144 C 140 140 144 136 148 136 Z" fill="url(#cutAccent)" />

  <!-- Upper Diagonal Wing of 'K' (Caramel gold with precision slice) -->
  <path d="M 226 250 L 334 142 C 338 138 344 138 348 142 L 378 172 C 382 176 382 182 378 186 L 280 284 L 226 250 Z" fill="url(#caramelGrad)" />

  <!-- Lower Diagonal Leg of 'K' with dynamic angle cut -->
  <path d="M 258 266 L 356 364 C 360 368 360 374 356 378 L 326 408 C 322 412 316 412 312 408 L 214 310 L 258 266 Z" fill="url(#caramelGrad)" />

  <!-- Center Cutting Diamond Accent -->
  <polygon points="248,256 268,236 288,256 268,276" fill="#FFFFFF" opacity="0.9" />
</svg>

